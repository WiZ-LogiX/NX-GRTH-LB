<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f4a34" />
      <stop offset="100%" stop-color="#08281c" />
    </linearGradient>
    <linearGradient id="nAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.2" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Inner Brand Symbol: Geometric "N" with Growth Dynamic -->
  <g filter="url(#subtleShadow)">
    <!-- Left Vertical Stem -->
    <path d="M 128 120 L 192 120 L 192 392 L 128 392 Z" fill="#ffffff" />
    
    <!-- Diagonal Connecting Blade -->
    <path d="M 172 120 L 336 348 L 336 392 L 272 392 L 128 190 L 128 120 Z" fill="url(#nAccentGrad)" />
    
    <!-- Right Vertical Stem -->
    <path d="M 320 120 L 384 120 L 384 392 L 320 392 Z" fill="#ffffff" />

    <!-- Growth Dot / Emerald Accent Beacon -->
    <circle cx="384" cy="120" r="28" fill="#10b981" />
  </g>
</svg>